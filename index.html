<body>
  <div class="loading_default loading_default_block_img">
    <div class="loading_default_img_back">
      <div class="loading_default_img_logo_scale">
        <div class="loading_default_img_logo" style="background-image:url('/icons/Icon-192.png');"></div>
      </div>
    </div>
    <!-- <div class="loading_default_block_title_footer_img">Пожалуйста, подождите...</div> -->
  </div>
  <script>
    function lcp_loading_default(param) {
      if (typeof param === 'undefined') {
        param = {};
      }
      var loading_show = param['loading_show'];
      if (loading_show === 'true') {
        lcp_loading_default_show();
      } else {
        lcp_loading_default_hidden();
      }
    }

    function lcp_loading_default_show() {
      document.body.classList.add('body_scroll_loading');
      document.querySelector('.loading_default')?.classList.remove('loading_hidden');
    }

    function lcp_loading_default_hidden() {
      document.body.classList.remove('body_scroll_loading');
      document.querySelector('.loading_default')?.classList.add('loading_hidden');
    }
  </script>
  <script>
    lcp_loading_default({ 'loading_show': 'true' });

    const observer = new MutationObserver((mutationsList, observer) => {
      const canvas = document.querySelector('flt-glass-pane') || document.querySelector('canvas');
      if (canvas) {
        lcp_loading_default({ 'loading_show': 'false' });
        observer.disconnect();
      }
    });

    observer.observe(document.body, { childList: true, subtree: true });
  </script>
  <script>
    var redirectPath = sessionStorage.getItem('redirect_path');
    if (redirectPath && redirectPath !== '/' && redirectPath !== '/index.html') {
      sessionStorage.removeItem('redirect_path');
      window.history.replaceState(null, '', redirectPath);
    }
  </script>
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) {
        return;
      }

      var nativeRegister = navigator.serviceWorker.register.bind(navigator.serviceWorker);
      navigator.serviceWorker.register = function (url, options) {
        if (String(url).indexOf('flutter_service_worker.js') !== -1) {
          return Promise.reject(new Error('Flutter service worker is disabled on this host'));
        }
        return nativeRegister(url, options);
      };

      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        return Promise.all(registrations.map(function (registration) {
          var scriptUrl = (registration.active && registration.active.scriptURL)
            || (registration.waiting && registration.waiting.scriptURL)
            || (registration.installing && registration.installing.scriptURL)
            || '';
          if (scriptUrl.indexOf('flutter_service_worker.js') !== -1) {
            return registration.unregister();
          }
          return Promise.resolve();
        }));
      }).then(function () {
        return nativeRegister('/firebase-messaging-sw.js');
      }).then(function (registration) {
        console.log('Service Worker registration successful with scope: ', registration.scope);
      }).catch(function (err) {
        console.log('Service Worker registration failed: ', err);
      });
    })();
  </script>
  <script>
    (function loadFlutterBootstrap(attempt) {
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      script.onerror = function () {
        if (attempt < 3) {
          setTimeout(function () {
            loadFlutterBootstrap(attempt + 1);
          }, attempt * 1000);
        }
      };
      document.body.appendChild(script);
    })(1);
  </script>
